plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rahulsingh.knowledgeverse'
    compileSdk 35

    defaultConfig {
        applicationId "com.rahulsingh.knowledgeverse"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
