name: Build KnowledgeVerse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Rename APK
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk \
          apk-output/KnowledgeVerse-2500-GK-India-Fixed-Rahul-Singh.apk

      - name: Upload KnowledgeVerse APK
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeVerse-APK
          path: apk-output/KnowledgeVerse-2500-GK-India-Fixed-Rahul-Singh.apk
          if-no-files-found: error
